{% extends "base.html" %}

{% block content %}

<h1 class="mb-4">Dashboard</h1>

<div class="row">

    <div class="col-md-3">

        <div class="card text-center mb-3">

            <div class="card-body">

                <h5>Total Products</h5>

                <h2>{{ total_products }}</h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card text-center mb-3">

            <div class="card-body">

                <h5>Total Categories</h5>

                <h2>{{ total_categories }}</h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card text-center mb-3">

            <div class="card-body">

                <h5>Total Inventory</h5>

                <h2>{{ total_inventory }}</h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card text-center mb-3">

            <div class="card-body">

                <h5>Average Price</h5>

                <h2>${{ average_price }}</h2>

            </div>

        </div>

    </div>

</div>

{% endblock %}
